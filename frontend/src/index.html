<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>欧托留日记</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="app-title">欧托留日记</div>
            <nav class="nav-menu">
                <div class="nav-item active" data-page="diary">📖 我的日记</div>
                <div class="nav-item" data-page="todo">✅ 待做清单</div>
                <div class="nav-item" data-page="calendar">📅 计划月历</div>
                <div class="nav-item" data-page="schedule">📋 日程表</div>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info" id="userInfo">加载中...</div>
                <button type="button" class="btn btn-default btn-logout" id="logoutBtn">🚪 退出登录</button>
            </div>
        </aside>

        <!-- 右侧主内容 -->
        <main class="main">
            <!-- ===== 我的日记 ===== -->
            <div class="page-panel active" id="pageDiary">
                <div class="main-header">
                    <div class="header-left">
                        <h1>我的日记</h1>
                        <div class="search-inline">
                            <input type="text" id="searchInput" placeholder="🔍 搜索标题或正文...">
                        </div>
                    </div>
                    <a href="edit.html" class="btn btn-primary">✏️ 写日记</a>
                </div>
                <div class="status-tip" id="statusTip">加载中...</div>
                <div class="diary-list" id="diaryList"></div>
            </div>

            <!-- ===== 待做清单 ===== -->
            <div class="page-panel" id="pageTodo">
                <div class="main-header">
                    <div class="header-left">
                        <h1>待做清单</h1>
                    </div>
                    <button class="btn btn-primary" id="addTodoBtn">➕ 新增待做</button>
                </div>
                <div class="todo-filters">
                    <span class="todo-filter active" data-filter="all">全部</span>
                    <span class="todo-filter" data-filter="today">今天</span>
                    <span class="todo-filter" data-filter="week">本周</span>
                    <span class="todo-filter" data-filter="important">重要</span>
                    <span class="todo-filter" data-filter="upcoming">⏰ 即将到期</span>
                    <span class="todo-filter" data-filter="overdue">❌ 已逾期</span>
                </div>
                <div class="todo-list" id="todoList"></div>
            </div>

            <!-- ===== 计划月历 ===== -->
            <div class="page-panel" id="pageCalendar">
                <div class="main-header">
                    <div class="header-left">
                        <h1>计划月历</h1>
                    </div>
                    <div class="calendar-nav">
                        <button class="btn btn-default btn-sm" id="calPrev">◀</button>
                        <span id="calMonth">2026年9月</span>
                        <button class="btn btn-default btn-sm" id="calNext">▶</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <!-- ===== 日程表 ===== -->
            <div class="page-panel" id="pageSchedule">
                <div class="main-header">
                    <div class="header-left">
                        <h1>日程表</h1>
                    </div>
                    <button class="btn btn-primary" id="addScheduleBtn">➕ 新增日程</button>
                </div>
                <div class="schedule-table-wrap">
                    <table class="schedule-table" id="scheduleTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>周一</th>
                                <th>周二</th>
                                <th>周三</th>
                                <th>周四</th>
                                <th>周五</th>
                                <th>周六</th>
                                <th>周日</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 待做清单弹窗 -->
    <div class="modal-overlay" id="todoModal" style="display:none;">
        <div class="modal" style="width:480px;">
            <div class="modal-header">
                <span id="todoModalTitle">新增待做</span>
                <span class="modal-close" id="todoModalClose">✕</span>
            </div>
            <div class="modal-body">
                <div class="form-field">
                    <label>标题 <span style="color:var(--danger)">*</span></label>
                    <input type="text" id="todoTitle" placeholder="待做标题..." maxlength="100">
                </div>
                <div class="form-field">
                    <label>描述</label>
                    <textarea id="todoDesc" placeholder="详细描述（可选）" rows="3"></textarea>
                </div>
                <div class="form-field">
                    <label>重要度</label>
                    <div class="importance-picker" id="todoImportance">
                        <span class="star" data-val="1">★</span>
                        <span class="star" data-val="2">★</span>
                        <span class="star" data-val="3">★</span>
                        <span class="star" data-val="4">★</span>
                        <span class="star" data-val="5">★</span>
                    </div>
                </div>
                <div class="form-field">
                    <label>截止日期</label>
                    <input type="date" id="todoDueDate">
                </div>
                <!-- 循环设置 -->
                <div class="form-field">
                    <label>循环方式</label>
                    <select id="todoRepeat">
                        <option value="">不循环</option>
                        <option value="daily">每天</option>
                        <option value="weekday">工作日</option>
                        <option value="weekly">每周</option>
                        <option value="monthly">每月</option>
                        <option value="custom">自定义（选星期）</option>
                    </select>
                </div>
                <!-- 自定义星期 -->
                <div class="form-field" id="weekdayPickerWrap" style="display:none;">
                    <label>选择星期</label>
                    <div class="weekday-picker" id="weekdayPicker">
                        <span class="weekday-btn" data-day="1">一</span>
                        <span class="weekday-btn" data-day="2">二</span>
                        <span class="weekday-btn" data-day="3">三</span>
                        <span class="weekday-btn" data-day="4">四</span>
                        <span class="weekday-btn" data-day="5">五</span>
                        <span class="weekday-btn" data-day="6">六</span>
                        <span class="weekday-btn" data-day="7">日</span>
                    </div>
                </div>
                <!-- 循环结束条件 -->
                <div class="form-field" id="repeatEndWrap" style="display:none;">
                    <label>循环结束</label>
                    <div class="form-row">
                        <select id="todoRepeatEndType">
                            <option value="never">永不结束</option>
                            <option value="count">循环N次后结束</option>
                            <option value="date">到指定日期结束</option>
                        </select>
                        <input type="number" id="todoRepeatEndCount" placeholder="次数" min="1" style="display:none;">
                        <input type="date" id="todoRepeatEndDate" style="display:none;">
                    </div>
                </div>
                <!-- 媒体上传 -->
                <div class="form-field">
                    <label>附件（图片/视频）</label>
                    <div class="todo-media-upload" id="todoMediaUpload">
                        <input type="file" id="todoFileInput" accept="image/*,video/*" multiple style="display:none;">
                        <div class="upload-zone" id="todoUploadZone">📷 点击或拖拽上传</div>
                        <div class="media-preview-list" id="todoMediaPreview"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" id="todoModalCancel">取消</button>
                <button class="btn btn-primary" id="todoModalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 完成记录弹窗 -->
    <div class="modal-overlay" id="completeModal" style="display:none;">
        <div class="modal" style="width:420px;">
            <div class="modal-header">
                <span>完成任务</span>
                <span class="modal-close" id="completeModalClose">✕</span>
            </div>
            <div class="modal-body">
                <div class="form-field">
                    <label>完成备注（可选）</label>
                    <textarea id="completeNote" placeholder="记录完成时的感想或备注..." rows="3"></textarea>
                </div>
                <div class="form-field">
                    <label>附件（图片/视频）</label>
                    <input type="file" id="completeFileInput" accept="image/*,video/*" multiple style="display:none;">
                    <div class="upload-zone" id="completeUploadZone">📷 点击上传</div>
                    <div class="media-preview-list" id="completeMediaPreview"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" id="completeModalCancel">取消</button>
                <button class="btn btn-primary" id="completeModalSave">确认完成</button>
            </div>
        </div>
    </div>

    <!-- 日程表弹窗 -->
    <div class="modal-overlay" id="scheduleModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <span>新增日程</span>
                <span class="modal-close" id="scheduleModalClose">✕</span>
            </div>
            <div class="modal-body">
                <div class="form-field">
                    <label>名称</label>
                    <input type="text" id="scheduleName" placeholder="课程/事项名称" maxlength="50">
                </div>
                <div class="form-row">
                    <div class="form-field">
                        <label>星期</label>
                        <select id="scheduleDay">
                            <option value="1">周一</option>
                            <option value="2">周二</option>
                            <option value="3">周三</option>
                            <option value="4">周四</option>
                            <option value="5">周五</option>
                            <option value="6">周六</option>
                            <option value="7">周日</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>时间段</label>
                        <select id="scheduleSlot">
                            <option value="1">第1节 (08:00-08:45)</option>
                            <option value="2">第2节 (08:55-09:40)</option>
                            <option value="3">第3节 (10:00-10:45)</option>
                            <option value="4">第4节 (10:55-11:40)</option>
                            <option value="5">第5节 (14:00-14:45)</option>
                            <option value="6">第6节 (14:55-15:40)</option>
                            <option value="7">第7节 (16:00-16:45)</option>
                            <option value="8">第8节 (16:55-17:40)</option>
                            <option value="9">第9节 (19:00-19:45)</option>
                            <option value="10">第10节 (19:55-20:40)</option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label>地点（可选）</label>
                    <input type="text" id="scheduleLocation" placeholder="教室/地点" maxlength="50">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-default" id="scheduleModalCancel">取消</button>
                <button class="btn btn-primary" id="scheduleModalSave">保存</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/list.js"></script>
</body>
</html>
