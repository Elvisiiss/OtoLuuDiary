# ============================================
# OtoLuuDiary 后端配置文件
# ============================================

# 服务端口
server.port=8080

# 服务上下文路径（所有 API 前缀）
server.servlet.context-path=/api

# ============================================
# MySQL 数据源配置
# ============================================
# 数据库地址：otoluudiary 库不存在时会自动创建（createDatabaseIfNotExist=true）
# 注意：MySQL 在虚拟机里或端口不是 3306 时，把 localhost:3306 改成实际地址
spring.datasource.url=jdbc:mysql://localhost:3306/otoluudiary?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# ↓↓↓ 等号后面填你的 MySQL root 密码；没有密码就留空 ↓↓↓
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 启动时自动执行 classpath 下的 schema.sql 建表（CREATE TABLE IF NOT EXISTS，可重复执行）
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ============================================
# MyBatis 配置
# ============================================
# Mapper XML 文件位置
mybatis.mapper-locations=classpath:mapper/*.xml
# 数据库下划线字段（created_at）自动映射 Java 驼峰属性（createdAt）
mybatis.configuration.map-underscore-to-camel-case=true
# 自定义类型处理器所在包（List<String> <-> JSON）
mybatis.type-handlers-package=com.otoluudiary.handler

# 旧 TXT 数据文件路径（仅首次启动时用于把历史数据导入 MySQL，之后不再使用）
otoluudiary.data.file=../data/diaries.txt

# 日志配置
logging.level.com.otoluudiary=INFO
# 打印 Mapper 执行的 SQL（开发调试方便；不想看 SQL 可改成 INFO）
logging.level.com.otoluudiary.mapper=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
